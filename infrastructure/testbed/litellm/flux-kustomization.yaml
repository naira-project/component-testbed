# Flux Kustomization CR — applied by `make testbed-litellm-up` when FLUX_SOURCE is set.
# Not included in kustomization.yaml resources (avoids self-referencing loop).
#
# Required: a Flux GitRepository named ${FLUX_SOURCE} must exist in flux-system.
# Override: FLUX_SOURCE=my-repo make testbed-litellm-up
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${LITELLM_NS}
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/testbed/litellm
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: naira-platform-openbao-secretstore
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE}
  postBuild:
    substitute:
      LITELLM_NS: ${LITELLM_NS}
