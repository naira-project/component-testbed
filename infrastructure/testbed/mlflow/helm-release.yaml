apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: naira-testbed-mlflow
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts
      sourceRef:
        kind: GitRepository
        name: mlflow
        namespace: flux-system
  values:
    fullnameOverride: mlflow
    server:
      value_options:
        host: 0.0.0.0
        port: 5000
        workers: 4
        allowed_hosts: "*"
      flag_options:
        - serve_artifacts
    mlflow:
      backendStoreUri: sqlite:////mlflow/mlflow.db
      defaultArtifactRoot: /mlflow/artifacts
      artifactsDestination: /mlflow/artifacts
    service:
      type: ClusterIP
    storage:
      enabled: true
      size: 1Gi
      accessMode: ReadWriteOnce
      mountPath: /mlflow
    resources:
      requests:
        memory: 2Gi
        cpu: 250m
      limits:
        memory: 4Gi
