# SPDX-License-Identifier: Apache-2.0
#
# RBAC for the platform-openbao init and seed jobs.
# The OpenBao server's own ServiceAccount is created and managed by the Helm chart.
# We bind system:auth-delegator to that chart-managed SA so OpenBao can verify
# Kubernetes ServiceAccount tokens for the kubernetes auth method.
---
# ServiceAccount for the one-time init job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init
  namespace: naira-platform-openbao
  labels:
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: openbao
---
# Role allowing the init job to create/update the openbao-unseal-keys Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-init
  namespace: naira-platform-openbao
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-init
  namespace: naira-platform-openbao
subjects:
  - kind: ServiceAccount
    name: openbao-init
    namespace: naira-platform-openbao
roleRef:
  kind: Role
  name: openbao-init
  apiGroup: rbac.authorization.k8s.io
---
# ServiceAccount for the idempotent seed job.
# The seed job uses envFrom to consume the openbao-seed-input Secret (mounted by
# the kubelet, not via kubectl). No additional RBAC permissions are required.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-seed
  namespace: naira-platform-openbao
  labels:
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: openbao
---
# Grant the chart-managed openbao SA system:auth-delegator so OpenBao can call
# the Kubernetes TokenReview API when validating Kubernetes auth method logins.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator
  labels:
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: openbao
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: naira-platform-openbao
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
