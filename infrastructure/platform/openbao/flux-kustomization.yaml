# Flux Kustomization CR for the OpenBao platform component.
# Applied by `make platform-openbao-up` alongside the regular kustomization.
# NOT included in kustomization.yaml resources — avoids a self-referencing loop.
#
# Prerequisites:
#   - A Flux GitRepository named $(FLUX_SOURCE) must exist in flux-system.
#   - Override the source name: FLUX_SOURCE=my-repo make platform-openbao-up
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: naira-platform-openbao
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/platform/openbao
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: component-testbed
