# Flux Kustomization CR for the OpenBao-backed External Secrets store.
# Applied by `make platform-openbao-up` after the platform Flux Kustomization.
# NOT included in kustomization.yaml resources — it needs ESO CRDs first.
#
# Prerequisites:
#   - A Flux GitRepository named ${FLUX_SOURCE} must exist in flux-system.
#   - Override the source name: FLUX_SOURCE=my-repo make platform-openbao-up
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: naira-platform-openbao-secretstore
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/platform/openbao/eso/clustersecretstore
  prune: true
  wait: true
  timeout: 2m
  dependsOn:
    - name: naira-platform-openbao
  sourceRef:
    kind: GitRepository
    name: ${FLUX_SOURCE}
