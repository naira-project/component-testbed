# Idempotent seed job — run by Platform Engineering via:
#   make platform-openbao-seed
#
# Configures OpenBao (engines, auth, policies, roles) and writes secrets.
# Input values come from the openbao-seed-input Secret (mounted via envFrom),
# which the Makefile creates from .env.testbed before running this job.
# The Secret is deleted by the Makefile after this job completes successfully.
#
# Idempotency rules:
#   - Empty env var → path is skipped (not written, not deleted)
#   - Existing path → preserved unless FORCE_OVERWRITE=true
#   - Demo secrets → always written (deterministic, non-sensitive)
#   - secret/scratch/* → never touched
#
# Set FORCE_OVERWRITE=true to overwrite existing secret values:
#   make platform-openbao-seed FORCE=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-seed-script
  namespace: naira-platform-openbao
  labels:
    app.kubernetes.io/name: openbao-seed
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: openbao
data:
  seed.sh: |
    #!/bin/sh
    set -eu

    FORCE_OVERWRITE="${FORCE_OVERWRITE:-false}"
    export BAO_ADDR BAO_TOKEN

    # ── helpers ─────────────────────────────────────────────────────────────

    log()  { echo "  $*"; }

    # Write a KV v2 path only if it doesn't exist yet (or FORCE_OVERWRITE=true).
    # All arguments after PATH are key=value pairs.
    # An entry is skipped if ALL values are empty strings.
    kv_put() {
      BAO_PATH="$1"; shift

      ALL_EMPTY=true
      for kv in "$@"; do
        VAL="${kv#*=}"
        [ -n "$VAL" ] && ALL_EMPTY=false && break
      done
      if [ "$ALL_EMPTY" = "true" ]; then
        log "SKIP(empty)    $BAO_PATH"
        return
      fi

      if [ "$FORCE_OVERWRITE" != "true" ]; then
        if bao kv get -format=json "$BAO_PATH" >/dev/null 2>&1; then
          log "SKIP(present)  $BAO_PATH"
          return
        fi
      else
        log "OVERWRITE      $BAO_PATH"
        bao kv put "$BAO_PATH" "$@"
        return
      fi

      log "WRITE          $BAO_PATH"
      bao kv put "$BAO_PATH" "$@"
    }

    enable_engine() {
      TYPE="$1"; PATH_="$2"
      if bao secrets list -format=json | grep -q "\"${PATH_}/\""; then
        log "engine already enabled: ${PATH_}/"
      else
        bao secrets enable -path="$PATH_" "$TYPE"
        log "enabled engine: ${PATH_}/"
      fi
    }

    enable_auth() {
      TYPE="$1"; PATH_="$2"
      if bao auth list -format=json | grep -q "\"${PATH_}/\""; then
        log "auth already enabled: ${PATH_}/"
      else
        bao auth enable -path="$PATH_" "$TYPE"
        log "enabled auth: ${PATH_}/"
      fi
    }

    write_policy() {
      NAME="$1"; RULES="$2"
      echo "$RULES" | bao policy write "$NAME" -
      log "policy: $NAME"
    }

    k8s_role() {
      ROLE="$1"; SA_NAME="$2"; SA_NS="$3"; POLICY="$4"
      bao write "auth/kubernetes/role/${ROLE}" \
        bound_service_account_names="$SA_NAME" \
        bound_service_account_namespaces="$SA_NS" \
        policies="$POLICY" \
        ttl="24h"
      log "k8s auth role: $ROLE → $SA_NS/$SA_NAME ($POLICY)"
    }

    # ── authenticate ────────────────────────────────────────────────────────

    echo "=== OpenBao Platform Seed ==="
    echo ""
    echo "--- Waiting for OpenBao to be unsealed..."
    until bao status -format=json 2>/dev/null | grep -Eq '"sealed"[[:space:]]*:[[:space:]]*false'; do
      sleep 3
    done
    echo "    OpenBao unsealed."

    # ── engines & auth ───────────────────────────────────────────────────────

    echo ""
    echo "--- Enabling secret engines and auth methods..."
    enable_engine kv-v2 secret
    enable_auth kubernetes kubernetes

    echo "--- Configuring Kubernetes auth method..."
    bao write auth/kubernetes/config \
      kubernetes_host="https://kubernetes.default.svc"
    log "kubernetes auth configured"

    # ── policies ─────────────────────────────────────────────────────────────

    echo ""
    echo "--- Writing policies..."

    write_policy eso-read '
    path "secret/data/*"     { capabilities = ["read"] }
    path "secret/metadata/*" { capabilities = ["list", "read"] }
    '

    for TESTBED in litellm mlflow openmetadata argocd grafana langfuse kserve opendatahub; do
      write_policy "${TESTBED}-readonly" "
    path \"secret/data/testbed/${TESTBED}/*\" { capabilities = [\"read\"] }
    path \"secret/data/demo/*\"              { capabilities = [\"read\"] }
    "
    done

    write_policy developer-scratch '
    path "secret/data/scratch/{{identity.entity.name}}/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    path "secret/metadata/scratch/{{identity.entity.name}}/*" {
      capabilities = ["list", "read", "delete"]
    }
    '

    # ── kubernetes auth roles ────────────────────────────────────────────────

    echo ""
    echo "--- Creating Kubernetes auth roles..."
    k8s_role eso            external-secrets external-secrets eso-read
    k8s_role litellm        default naira-testbed-litellm       litellm-readonly
    k8s_role mlflow         default naira-testbed-mlflow        mlflow-readonly
    k8s_role openmetadata   default naira-testbed-openmetadata  openmetadata-readonly
    k8s_role argocd         default naira-testbed-argocd        argocd-readonly
    k8s_role grafana        default naira-testbed-grafana       grafana-readonly
    k8s_role langfuse       default naira-testbed-langfuse      langfuse-readonly
    k8s_role kserve         default naira-testbed-kserve        kserve-readonly
    k8s_role opendatahub    default naira-testbed-opendatahub   opendatahub-readonly

    # ── demo secrets (always written) ────────────────────────────────────────

    echo ""
    echo "--- Writing demo secrets..."
    bao kv put secret/demo/hello \
      message="Hello from OpenBao! Naira test environment." \
      platform="naira-testbed"
    log "WRITE          secret/demo/hello"

    bao kv put secret/demo/connection \
      host="openbao.naira-platform-openbao.svc.cluster.local" \
      port="8200" \
      tls="false"
    log "WRITE          secret/demo/connection"

    # ── testbed secrets (from env vars via openbao-seed-input envFrom) ────────
    # All variables are available as environment variables in this container.
    # Empty variables cause kv_put to emit SKIP(empty) and leave the path untouched.

    echo ""
    echo "--- Writing testbed secrets from seed input..."

    # LiteLLM
    kv_put secret/testbed/litellm/mistral \
      "api_key=${LITELLM_MISTRAL_API_KEY:-}"

    kv_put secret/testbed/litellm/openai \
      "api_key=${LITELLM_OPENAI_API_KEY:-}"

    kv_put secret/testbed/litellm/anthropic \
      "api_key=${LITELLM_ANTHROPIC_API_KEY:-}"

    kv_put secret/testbed/litellm/azure-openai \
      "api_key=${LITELLM_AZURE_OPENAI_API_KEY:-}" \
      "api_base=${LITELLM_AZURE_OPENAI_API_BASE:-}" \
      "api_version=${LITELLM_AZURE_OPENAI_API_VERSION:-}"

    # MLflow
    kv_put secret/testbed/mlflow/s3 \
      "access_key=${MLFLOW_S3_ACCESS_KEY:-}" \
      "secret_key=${MLFLOW_S3_SECRET_KEY:-}" \
      "endpoint_url=${MLFLOW_S3_ENDPOINT_URL:-}"

    # OpenMetadata
    kv_put secret/testbed/openmetadata/admin \
      "username=${OPENMETADATA_ADMIN_USERNAME:-}" \
      "password=${OPENMETADATA_ADMIN_PASSWORD:-}"

    # ArgoCD
    kv_put secret/testbed/argocd/admin \
      "username=${ARGOCD_ADMIN_USERNAME:-}" \
      "password=${ARGOCD_ADMIN_PASSWORD:-}"

    # Grafana
    kv_put secret/testbed/grafana/admin \
      "username=${GRAFANA_ADMIN_USERNAME:-}" \
      "password=${GRAFANA_ADMIN_PASSWORD:-}"

    # Langfuse
    kv_put secret/testbed/langfuse/api \
      "public_key=${LANGFUSE_PUBLIC_KEY:-}" \
      "secret_key=${LANGFUSE_SECRET_KEY:-}" \
      "host=${LANGFUSE_HOST:-}"

    # KServe
    kv_put secret/testbed/kserve/model-registry \
      "url=${KSERVE_MODEL_REGISTRY_URL:-}" \
      "token=${KSERVE_MODEL_REGISTRY_TOKEN:-}"

    # OpenDataHub
    kv_put secret/testbed/opendatahub/admin \
      "username=${OPENDATAHUB_ADMIN_USERNAME:-}" \
      "password=${OPENDATAHUB_ADMIN_PASSWORD:-}"

    echo ""
    echo "=== Seeding complete ==="
    echo "    The Makefile will delete the openbao-seed-input Secret now."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-seed
  namespace: naira-platform-openbao
  labels:
    app.kubernetes.io/name: openbao-seed
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: openbao
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-seed
        app.kubernetes.io/part-of: naira-platform
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openbao-seed
      containers:
        - name: seed
          image: openbao/openbao:2.5.3
          env:
            - name: BAO_ADDR
              value: "http://openbao.naira-platform-openbao.svc.cluster.local:8200"
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-unseal-keys
                  key: root_token
            - name: FORCE_OVERWRITE
              value: "false"
          envFrom:
            - secretRef:
                name: openbao-seed-input
          command: ["/bin/sh", "/scripts/seed.sh"]
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: seed-script
              mountPath: /scripts
      volumes:
        - name: seed-script
          configMap:
            name: openbao-seed-script
            defaultMode: 0755
