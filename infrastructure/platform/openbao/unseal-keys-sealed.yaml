# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  PLACEHOLDER — REPLACE WITH REAL ENCRYPTED SECRET AFTER FIRST INIT     ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# This file must contain the openbao-unseal-keys Secret encrypted for this
# cluster. It is cluster-specific and cannot be pre-generated.
#
# Run `make platform-openbao-init` first, then encrypt the resulting Secret
# with your cluster's chosen encryption tool and commit the result here.
#
# ── SealedSecrets (kubeseal) ─────────────────────────────────────────────
#
#   kubeseal --fetch-cert --controller-namespace kube-system \
#     > /tmp/sealed-secrets-cert.pem
#
#   kubectl get secret openbao-unseal-keys \
#     -n naira-platform-openbao -o yaml \
#     | kubeseal --cert /tmp/sealed-secrets-cert.pem \
#         --scope namespace-wide -o yaml \
#     > infrastructure/platform/openbao/unseal-keys-sealed.yaml
#
#   Then add unseal-keys-sealed.yaml to kustomization.yaml resources.
#
# ── SOPS + AGE ──────────────────────────────────────────────────────────
#
#   kubectl get secret openbao-unseal-keys \
#     -n naira-platform-openbao -o yaml \
#     | sops --encrypt \
#         --input-type yaml \
#         --output-type yaml \
#         --age "$(cat ~/.config/sops/age/keys.txt | grep 'public key' | awk '{print $4}')" \
#         /dev/stdin \
#     > infrastructure/platform/openbao/unseal-keys-sealed.yaml
#
#   Add a .sops.yaml at the repo root to configure SOPS for automatic
#   encryption/decryption on `kubectl apply`.
#
# ── After committing ─────────────────────────────────────────────────────
#
#   1. Add unseal-keys-sealed.yaml to resources in kustomization.yaml
#   2. Apply: kubectl apply -k infrastructure/platform/openbao/
#      (Flux will decrypt and create the Secret automatically)
#   3. Restart the pod: kubectl rollout restart statefulset/openbao \
#        -n naira-platform-openbao
#
