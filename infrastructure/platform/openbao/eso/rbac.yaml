#
# Grant external-secrets SA system:auth-delegator so it can present its own
# ServiceAccount token to OpenBao's Kubernetes auth method and have OpenBao
# verify that token via the TokenReview API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-auth-delegator
  labels:
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: external-secrets
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
