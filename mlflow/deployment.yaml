apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: naira-testbed-mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: naira-testbed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: naira-testbed
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.12.0
          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////mlflow/data/mlflow.db
            - --default-artifact-root
            - /mlflow/data/artifacts
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --allowed-hosts
            - "*"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          # resources:
          #   requests:
          #     memory: 256Mi
          #     cpu: 250m
          #   limits:
          #     memory: 512Mi
          #     cpu: 500m
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow/data
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
