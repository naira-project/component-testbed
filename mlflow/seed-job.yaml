# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-seed-script
  namespace: naira-testbed-mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: naira-testbed
data:
  seed.py: |
    # SPDX-License-Identifier: Apache-2.0
    #
    # MLflow 3 compatible seed script.
    # Stages (Staging/Production) are replaced by model version aliases per MLflow 3 migration guide.
    # transition_model_version_stage() is removed in v3; use set_registered_model_alias() instead.
    import os
    import time
    import tempfile
    import mlflow
    from mlflow.tracking import MlflowClient

    MLFLOW_URI = os.environ.get("MLFLOW_TRACKING_URI", "http://mlflow:5000")

    # alias=None means no alias assigned (equivalent to former "None" stage)
    MODELS = [
        {
            "name": "text-classifier-v1",
            "description": "Binary text classification model for spam detection.",
            "tags": {"task": "classification", "framework": "scikit-learn", "dataset": "custom-emails"},
            "versions": [
                {
                    "alias": "staging",
                    "description": "Candidate model — improved recall on imbalanced classes.",
                    "tags": {"validated_by": "ci-pipeline"},
                    "metrics": {"accuracy": 0.87, "f1_score": 0.85, "latency_ms": 12.3},
                },
                {
                    "alias": "production",
                    "description": "Current production model.",
                    "tags": {"validated_by": "qa-team"},
                    "metrics": {"accuracy": 0.91, "f1_score": 0.89, "latency_ms": 10.1},
                },
            ],
        },
        {
            "name": "sentiment-analyzer",
            "description": "Multi-class sentiment analysis model (positive/neutral/negative).",
            "tags": {"task": "sentiment", "framework": "transformers", "dataset": "yelp-reviews"},
            "versions": [
                {
                    "alias": None,
                    "description": "Initial baseline, not yet validated.",
                    "tags": {"validated_by": "none"},
                    "metrics": {"accuracy": 0.78, "f1_score": 0.76, "latency_ms": 45.2},
                },
                {
                    "alias": "staging",
                    "description": "Fine-tuned on domain-specific corpus.",
                    "tags": {"validated_by": "ci-pipeline"},
                    "metrics": {"accuracy": 0.82, "f1_score": 0.80, "latency_ms": 42.1},
                },
                {
                    "alias": "production",
                    "description": "Promoted after A/B test showed 4pp improvement.",
                    "tags": {"validated_by": "qa-team"},
                    "metrics": {"accuracy": 0.85, "f1_score": 0.83, "latency_ms": 38.9},
                },
            ],
        },
        {
            "name": "summarization-model",
            "description": "Abstractive text summarization model for long-form documents.",
            "tags": {"task": "summarization", "framework": "pytorch", "dataset": "cnn-dailymail"},
            "versions": [
                {
                    "alias": "staging",
                    "description": "First summarization candidate, under evaluation.",
                    "tags": {"validated_by": "ci-pipeline"},
                    "metrics": {"rouge1": 0.42, "rouge2": 0.19, "latency_ms": 210.5},
                },
                {
                    "alias": "production",
                    "description": "Optimized with quantization — 7% latency reduction.",
                    "tags": {"validated_by": "qa-team"},
                    "metrics": {"rouge1": 0.45, "rouge2": 0.21, "latency_ms": 195.3},
                },
            ],
        },
    ]


    def wait_for_mlflow(uri: str, timeout: int = 120) -> None:
        import urllib.request
        deadline = time.time() + timeout
        while time.time() < deadline:
            try:
                with urllib.request.urlopen(f"{uri}/health", timeout=3) as resp:
                    if resp.status == 200:
                        print(f"MLflow ready at {uri}")
                        return
            except Exception:
                pass
            time.sleep(3)
        raise RuntimeError(f"MLflow not ready after {timeout}s at {uri}")


    def get_or_create_registered_model(client: MlflowClient, model: dict) -> None:
        existing = [m.name for m in client.search_registered_models(f"name='{model['name']}'")]
        if not existing:
            print(f"Creating registered model: {model['name']}")
            client.create_registered_model(
                name=model["name"],
                description=model["description"],
                tags=model["tags"],
            )
        else:
            print(f"Registered model already exists: {model['name']}")


    def seed_versions(client: MlflowClient, model: dict, experiment_id: str) -> None:
        existing_versions = client.search_model_versions(f"name='{model['name']}'")
        expected_count = len(model["versions"])
        if len(existing_versions) >= expected_count:
            print(f"  Versions already seeded for {model['name']} ({len(existing_versions)} found), skipping.")
            return

        for i, ver_cfg in enumerate(model["versions"]):
            print(f"  Creating version {i + 1} for {model['name']} (alias: {ver_cfg['alias']})")

            with mlflow.start_run(experiment_id=experiment_id) as run:
                mlflow.set_tags(model["tags"])
                mlflow.set_tag("model_name", model["name"])
                mlflow.set_tag("version_index", str(i))
                for metric_name, value in ver_cfg["metrics"].items():
                    mlflow.log_metric(metric_name, value)

                with tempfile.TemporaryDirectory() as tmpdir:
                    model_file = os.path.join(tmpdir, "model.txt")
                    with open(model_file, "w") as f:
                        f.write(f"Seed placeholder for {model['name']} v{i + 1}\n")
                    mlflow.log_artifact(model_file, artifact_path="model")

                artifact_uri = f"{run.info.artifact_uri}/model"

            mv = client.create_model_version(
                name=model["name"],
                source=artifact_uri,
                run_id=run.info.run_id,
                description=ver_cfg["description"],
                tags=ver_cfg["tags"],
            )

            # MLflow 3: stages removed, use aliases instead of transition_model_version_stage()
            if ver_cfg["alias"] is not None:
                client.set_registered_model_alias(
                    name=model["name"],
                    alias=ver_cfg["alias"],
                    version=mv.version,
                )


    def seed_experiment(client: MlflowClient) -> str:
        exp_name = "testbed-experiments"
        exp = client.get_experiment_by_name(exp_name)
        if exp is not None:
            print(f"Experiment '{exp_name}' already exists.")
            return exp.experiment_id

        print(f"Creating experiment: {exp_name}")
        exp_id = client.create_experiment(
            exp_name,
            tags={"purpose": "testbed", "managed_by": "seed-job"},
        )

        for i, (accuracy, f1) in enumerate([(0.72, 0.70), (0.79, 0.77)]):
            with mlflow.start_run(experiment_id=exp_id, run_name=f"baseline-run-{i + 1}"):
                mlflow.log_params({"learning_rate": 0.01 * (i + 1), "epochs": 10 + i * 5})
                mlflow.log_metrics({"accuracy": accuracy, "f1_score": f1})

        return exp_id


    def main() -> None:
        wait_for_mlflow(MLFLOW_URI)
        mlflow.set_tracking_uri(MLFLOW_URI)
        client = MlflowClient()

        print("=== Seeding MLflow testbed ===")
        experiment_id = seed_experiment(client)

        for model in MODELS:
            get_or_create_registered_model(client, model)
            seed_versions(client, model, experiment_id)

        print("=== Seeding complete ===")


    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-seed
  namespace: naira-testbed-mlflow
  labels:
    app.kubernetes.io/name: mlflow-seed
    app.kubernetes.io/part-of: naira-testbed
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-seed
        app.kubernetes.io/part-of: naira-testbed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: ghcr.io/mlflow/mlflow:v3.12.0
          command:
            - python
            - /scripts/seed.py
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.naira-testbed-mlflow.svc.cluster.local:5000"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
          volumeMounts:
            - name: seed-script
              mountPath: /scripts
      volumes:
        - name: seed-script
          configMap:
            name: mlflow-seed-script
