apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: naira-testbed-mlflow
spec:
  interval: 5m
  chart:
    spec:
      chart: mlflow
      version: 1.8.1
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  values:
    log:
      enabled: false
    extraArgs:
      allowedHosts: "*"
    backendStore:
      defaultSqlitePath: /mlflow/data/mlflow.db
    artifactRoot:
      proxiedArtifactStorage: true
      defaultArtifactsDestination: /mlflow/data/artifacts
    service:
      port: 5000
    resources:
      requests:
        memory: 2Gi
        cpu: 250m
      limits:
        memory: 4Gi
    extraVolumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-data
    extraVolumeMounts:
      - name: mlflow-data
        mountPath: /mlflow/data
